remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"   # air, contrast, dark, dirt, mint, neon, plum, sunrise

locale: "en-GB"
title: "Guillermo Gil de Avalle"
name: "Guillermo Gil de Avalle"
description: "Guillermo Gil de Avalle is a PhD candidate in artificial intelligence at the University of Groningen (OPERA), working on grounded agentic AI for reliable industrial operations."
url: "https://guille-gil.github.io"
repository: "guille-gil/guille-gil.github.io"

og_image: "/assets/images/og.png"

words_per_minute: 200
search: false

author:
  name: "Guillermo Gil de Avalle"
  bio: "PhD candidate, University of Groningen"
  location: "Groningen (NL)"
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=r9g7B5sAAAAJ"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0009-0004-1538-2256"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/guille-gil"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/guillermo-gil-de-avalle-bellido"

footer:
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=r9g7B5sAAAAJ"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/guille-gil"

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
